<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ativar E-mail FormSubmit</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 100px; background: #f0f4f8; }
    .card { background: #fff; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    button { background: #2563eb; color: #fff; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Passo único de Ativação</h2>
    <p>Para o envio de e-mails em segundo plano funcionar, precisamos ativar seu e-mail.</p>
    <p>Clique no botão abaixo. Você será redirecionado, e o FormSubmit enviará um e-mail de ativação.</p>
    <br>
    <form action="https://formsubmit.co/davisilvace@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Ativação do Formulário">
      <input type="hidden" name="Mensagem" value="Este é o e-mail de ativação do sistema.">
      <button type="submit">Ativar davi***@gmail.com</button>
    </form>
  </div>
</body>
</html>
